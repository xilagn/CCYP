name: Build React Native Android Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-rn-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 安装依赖 + 生成原生android/ios目录
      - name: Install deps & eject Expo
        run: |
          npm ci
          # 生成原生目录（Expo 项目执行eject，或RN项目执行npx react-native init补全）
          npx expo prebuild --platform android # 关键：生成android目录

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            android/build.gradle
            android/app/build.gradle
            android/gradle-wrapper.properties

      # 构建Debug包（此时已有android目录）
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 上传产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rn-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
